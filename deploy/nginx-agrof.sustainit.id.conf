# Reverse proxy untuk agrof.sustainit.id -> Next.js standalone di 127.0.0.1:3000
# Pasang: sudo cp deploy/nginx-agrof.sustainit.id.conf /etc/nginx/sites-available/agrof.sustainit.id
#         sudo ln -sf /etc/nginx/sites-available/agrof.sustainit.id /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
# SSL:    sudo certbot --nginx -d agrof.sustainit.id  (menambahkan blok 443 otomatis)

server {
    listen 80;
    listen [::]:80;
    server_name agrof.sustainit.id;

    # Server Action bodySizeLimit di next.config.ts = 8mb; beri sedikit ruang.
    client_max_body_size 10m;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
